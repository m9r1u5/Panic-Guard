name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: npm install

      - name: Copy web app
        run: |
          mkdir -p www
          cp index.html www/
          cp node_modules/@capacitor/core/dist/capacitor.js www/

      - name: Create Android project
        run: npx cap add android

      - name: Add native code and patch project
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: python3 patch_android.py

      - name: Signing key (keeps updates installable)
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          test -s debug.keystore || { echo "debug.keystore is missing or empty in the repo"; exit 1; }
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android/app/debug.keystore
          else
            cp debug.keystore android/app/debug.keystore
          fi
          ls -l android/app/debug.keystore

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Show signing fingerprint
        run: |
          keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep -E "Owner|SHA256" | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          cp android/app/build/outputs/apk/debug/app-debug.apk PanicGuard.apk
          gh release create "$TAG" PanicGuard.apk \
            --title "Panic Guard $TAG" \
            --notes "Debug build $TAG" \
            --latest
