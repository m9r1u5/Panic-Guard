<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panic Guard</title>
<style>
  :root { --bg:#000; --fg:#fff; --red:#d50000; --amber:#ffb300; --green:#00c853; --card:#1a1a1a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family:system-ui,sans-serif; font-size:18px; }
  #app { display:flex; flex-direction:column; height:100%;
    padding-top:env(safe-area-inset-top); }
  main { flex:1; overflow-y:auto; padding:16px; }
  h1 { margin:0 0 4px; font-size:28px; }
  .sub { color:#bbb; margin-bottom:16px; }
  .card { background:var(--card); border-radius:16px; padding:16px; margin-bottom:16px; }
  .btn { display:block; width:100%; min-height:64px; border:3px solid var(--fg);
    border-radius:16px; background:#000; color:var(--fg); font-size:22px; font-weight:700; margin-top:12px; }
  .btn.primary { background:var(--amber); color:#000; border-color:var(--amber); }
  .btn:disabled { opacity:.4; }
  nav { display:flex; gap:8px; padding:8px 8px calc(8px + env(safe-area-inset-bottom));
    background:#111; border-top:2px solid #444; }
  nav button { flex:1; min-height:60px; border:2px solid #fff; border-radius:14px;
    background:#000; color:#fff; font-size:18px; font-weight:700; }
  nav button.active { background:#fff; color:#000; }
  .bar { height:14px; background:#333; border-radius:8px; overflow:hidden; margin-top:12px; }
  .bar > div { height:100%; width:0; background:var(--green); }
  .ok { color:var(--green); } .warn { color:var(--amber); } .bad { color:#ff5252; }
  .hidden { display:none; }
</style>
</head>
<body>
<div id="app">
  <main>
    <section id="home">
      <h1>Panic Guard</h1>
      <div class="sub" id="ver">Version …</div>
      <div class="card">
        <b>Stage 1 build</b><br>
        The app installs, shares and updates. The panic button, contacts, PIN and
        recording arrive in the next stages.
      </div>
    </section>

    <section id="update" class="hidden">
      <h1>Update</h1>
      <div class="card">
        <div>Installed: <b id="u-inst">…</b></div>
        <div>Latest: <b id="u-latest">not checked</b></div>
        <div id="u-msg" class="sub" style="margin:8px 0 0"></div>
        <div class="bar hidden" id="u-barwrap"><div id="u-bar"></div></div>
      </div>
      <button class="btn" id="u-check">CHECK FOR UPDATE</button>
      <button class="btn primary hidden" id="u-install">DOWNLOAD &amp; INSTALL</button>
    </section>
  </main>

  <nav>
    <button id="n-home" class="active">HOME</button>
    <button id="n-share">SHARE</button>
    <button id="n-update">UPDATE</button>
  </nav>
</div>

<script>
// ---- Settings: change REPO if your GitHub repository has a different name ----
const OWNER = 'm9r1u5';
const REPO  = 'Panic-Guard';
const RELEASES_PAGE = `https://github.com/${OWNER}/${REPO}/releases/latest`;
const APK_URL = `https://github.com/${OWNER}/${REPO}/releases/latest/download/PanicGuard.apk`;
const API_LATEST = `https://api.github.com/repos/${OWNER}/${REPO}/releases/latest`;

const $ = id => document.getElementById(id);
const PG = window.Capacitor && Capacitor.registerPlugin ? Capacitor.registerPlugin('PanicGuard') : null;
let installed = { versionName: '?', versionCode: 0 };
let latest = null;

function show(name) {
  for (const s of ['home','update']) $(s).classList.toggle('hidden', s !== name);
  $('n-home').classList.toggle('active', name === 'home');
  $('n-update').classList.toggle('active', name === 'update');
}

async function loadInfo() {
  try {
    installed = await PG.getAppInfo();
  } catch (e) { /* running outside the app */ }
  $('ver').textContent = 'Version ' + installed.versionName;
  $('u-inst').textContent = installed.versionName;
}

$('n-home').onclick = () => show('home');
$('n-update').onclick = () => { show('update'); };

$('n-share').onclick = async () => {
  try {
    await PG.shareText({
      title: 'Share Panic Guard',
      text: 'Panic Guard (Android app). Download the latest version here: ' + RELEASES_PAGE
    });
  } catch (e) { alert('Could not open the share sheet.'); }
};

$('u-check').onclick = async () => {
  const msg = $('u-msg');
  $('u-install').classList.add('hidden');
  msg.className = 'sub'; msg.textContent = 'Checking…';
  if (!navigator.onLine) {
    msg.className = 'sub warn';
    msg.textContent = 'You are offline. Updating needs an internet connection.';
    return;
  }
  try {
    const r = await fetch(API_LATEST, { headers: { Accept: 'application/vnd.github+json' } });
    if (r.status === 404) { msg.textContent = 'No release found yet.'; return; }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    const m = /(\d+)\s*$/.exec(j.tag_name || '');
    const code = m ? parseInt(m[1], 10) : 0;
    latest = { tag: j.tag_name, code };
    $('u-latest').textContent = (j.tag_name || '?').replace(/^v/, '');
    if (code > installed.versionCode) {
      msg.className = 'sub warn';
      msg.textContent = 'A newer version is available.';
      $('u-install').classList.remove('hidden');
    } else {
      msg.className = 'sub ok';
      msg.textContent = 'You have the latest version.';
    }
  } catch (e) {
    msg.className = 'sub warn';
    msg.textContent = 'Could not reach GitHub. Check your connection and try again.';
  }
};

$('u-install').onclick = async () => {
  const msg = $('u-msg');
  try {
    const { allowed } = await PG.canInstall();
    if (!allowed) {
      msg.className = 'sub warn';
      msg.textContent = 'Allow "Install unknown apps" for Panic Guard on the next screen, press back, then tap this button again.';
      await PG.openInstallSettings();
      return;
    }
    msg.className = 'sub'; msg.textContent = 'Downloading…';
    $('u-barwrap').classList.remove('hidden');
    $('u-bar').style.width = '0%';
    await PG.addListener('downloadProgress', p => { $('u-bar').style.width = p.percent + '%'; });
    await PG.downloadAndInstall({ url: APK_URL });
    msg.textContent = 'Opening installer…';
  } catch (e) {
    msg.className = 'sub bad';
    msg.textContent = 'Update failed: ' + (e.message || e);
  }
};

loadInfo();
</script>
</body>
</html>
