<!DOCTYPE html>
<html lang="en">
<head>
<script src="capacitor.js" onerror="void 0"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panic Guard</title>
<style>
  :root { --bg:#000; --fg:#fff; --amber:#ffb300; --green:#00c853; --red:#ff5252; --card:#1a1a1a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family:system-ui,sans-serif; font-size:18px; }
  #app { display:flex; flex-direction:column; height:100%; padding-top:env(safe-area-inset-top); }
  main { flex:1; overflow-y:auto; padding:16px; }
  h1 { margin:0 0 6px; font-size:28px; }
  h2 { margin:0 0 8px; font-size:20px; }
  p { line-height:1.4; }
  .sub { color:#bbb; margin-bottom:12px; }
  .card { background:var(--card); border-radius:16px; padding:16px; margin-bottom:16px; }
  .btn { display:block; width:100%; min-height:64px; border:3px solid var(--fg); border-radius:16px;
    background:#000; color:var(--fg); font-size:21px; font-weight:700; margin-top:12px; }
  .btn.primary { background:var(--amber); color:#000; border-color:var(--amber); }
  .btn.small { min-height:48px; font-size:17px; }
  .btn:disabled { opacity:.35; }
  nav { display:flex; gap:4px; padding:8px 6px calc(8px + env(safe-area-inset-bottom));
    background:#111; border-top:2px solid #444; }
  nav button { flex:1; min-width:0; padding:0; min-height:58px; border:2px solid #fff; border-radius:14px;
    background:#000; color:#fff; font-size:10.5px; font-weight:700; overflow:hidden; }
  nav button.active { background:#fff; color:#000; }
  .bar { height:14px; background:#333; border-radius:8px; overflow:hidden; margin-top:12px; }
  .bar > div { height:100%; width:0; background:var(--green); }
  .ok { color:var(--green); } .warn { color:var(--amber); } .bad { color:var(--red); }
  .hidden { display:none !important; }
  .full { position:fixed; inset:0; background:#000; z-index:50; overflow-y:auto;
    padding:calc(16px + env(safe-area-inset-top)) 16px 16px; }
  .dots { font-size:34px; letter-spacing:10px; text-align:center; min-height:50px; margin:6px 0; }
  .pad { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .pad button { min-height:72px; font-size:28px; font-weight:700; border:2px solid #fff;
    border-radius:16px; background:#111; color:#fff; }
  .pad button.go { background:var(--amber); color:#000; border-color:var(--amber); }
  textarea { width:100%; min-height:130px; font-size:18px; background:#111; color:#fff;
    border:2px solid #fff; border-radius:12px; padding:12px; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:8px 0;
    border-bottom:1px solid #333; }
  .row:last-child { border-bottom:0; }
  .row button { min-height:44px; padding:0 14px; border:2px solid #fff; border-radius:12px;
    background:#000; color:#fff; font-size:16px; font-weight:700; }
  .prog { color:#999; font-size:15px; margin-bottom:8px; }
  .btn.big { min-height:84px; font-size:26px; }
  #pbtn { position:relative; width:min(78vw,300px); aspect-ratio:1; border-radius:50%; background:#d50000;
    border:6px solid #fff; margin:8px auto 18px; display:flex; align-items:center; justify-content:center;
    user-select:none; -webkit-user-select:none; touch-action:none; }
  #pring { position:absolute; inset:0; border-radius:50%;
    -webkit-mask:radial-gradient(circle, transparent 66%, #000 67%); mask:radial-gradient(circle, transparent 66%, #000 67%); }
  #plabel { position:relative; font-size:44px; font-weight:900; text-align:center; pointer-events:none; }
  #plabel small { display:block; font-size:16px; font-weight:700; margin-top:6px; }
  #choose { z-index:45; } #panic { z-index:40; }
  .calc { max-width:420px; margin:0 auto; height:100%; display:flex; flex-direction:column; justify-content:flex-end; }
  #cd { background:#222; color:#fff; font-size:54px; text-align:right; padding:18px 14px; border-radius:12px;
    margin-bottom:12px; overflow:hidden; white-space:nowrap; user-select:none; -webkit-user-select:none; touch-action:none; }
  .ckeys { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .ckeys button { min-height:72px; font-size:28px; border:0; border-radius:14px; background:#333; color:#fff;
    user-select:none; -webkit-user-select:none; touch-action:none; }
  .ckeys button.op { background:#ff9500; } .ckeys button.fn { background:#555; }
  #blank { position:fixed; inset:0; background:#000; }
  .msgline { padding:8px 0; border-bottom:1px solid #333; }
</style>
</head>
<body>
<div id="app">
  <main>
    <section id="home">
      <h1>Panic Guard</h1>
      <div class="sub" id="ver">Version …</div>
      <div id="warn"></div>
      <div class="card" id="summary"></div>
      <div id="panicbox"></div>
      <div class="card sub" style="font-size:15px"><b>Good to know:</b> while recording, Android always shows a camera/microphone
        dot at the top of the screen and a small notification (named "Background sync"). Android does not allow apps to hide these.</div>
    </section>

    <section id="update" class="hidden">
      <h1>Update</h1>
      <div class="card">
        <div>Installed: <b id="u-inst">…</b></div>
        <div>Latest: <b id="u-latest">not checked</b></div>
        <div id="u-msg" class="sub" style="margin:8px 0 0"></div>
        <div class="bar hidden" id="u-barwrap"><div id="u-bar"></div></div>
      </div>
      <button class="btn" id="u-check">CHECK FOR UPDATE</button>
      <button class="btn primary hidden" id="u-install">DOWNLOAD &amp; INSTALL</button>
    </section>

    <section id="settings" class="hidden"></section>
    <section id="recs" class="hidden"></section>
  </main>

  <nav>
    <button id="n-home" class="active">HOME</button>
    <button id="n-settings">SETTINGS</button>
    <button id="n-install">INSTALL</button>
    <button id="n-share">SHARE</button>
    <button id="n-update">UPDATE</button>
  </nav>
</div>

<div id="wiz" class="full hidden"></div>
<div id="choose" class="full hidden"></div>
<div id="legal" class="full hidden" style="z-index:60"></div>
<div id="panic" class="full hidden"></div>
<div id="lock" class="full hidden"></div>

<script>
// ---------------- constants ----------------
const OWNER = 'm9r1u5';
const REPO  = 'Panic-Guard';
const RELEASES_PAGE = `https://github.com/${OWNER}/${REPO}/releases/latest`;
const APK_URL = `https://github.com/${OWNER}/${REPO}/releases/latest/download/PanicGuard.apk`;
const API_LATEST = `https://api.github.com/repos/${OWNER}/${REPO}/releases/latest`;
const DEFAULT_MSG = 'EMERGENCY - I need help. This is an automatic alert from my Panic Guard app. Please call me or come to my location.';

const $ = id => document.getElementById(id);
const PG = (() => {
  const C = window.Capacitor;
  if (!C) return null;
  try { if (typeof C.registerPlugin === 'function') return C.registerPlugin('PanicGuard'); } catch (e) {}
  return (C.Plugins && C.Plugins.PanicGuard) || null;
})();
let installed = { versionName: '?', versionCode: 0 };
let VALS = {};

async function N(method, args) {
  if (!PG) throw new Error('Open the installed Panic Guard app, not the website.');
  return PG[method](args || {});
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function loadVals() { try { VALS = await N('getValues'); } catch (e) { VALS = {}; } }
async function saveVals(o) { await N('setValues', { values: o }); await loadVals(); }

// ---------------- PIN pad ----------------
function pad(el, o) {
  const min = o.min || 4, max = 8;
  let v = '';
  el.innerHTML = `<h1>${o.title}</h1><div class="sub">${o.sub || ''}</div>
    <div class="dots" id="pdots"></div><div class="sub bad" id="perr" style="text-align:center;min-height:24px"></div>
    <div class="pad">${[1,2,3,4,5,6,7,8,9,'⌫',0,'OK'].map(k =>
      `<button data-k="${k}" class="${k==='OK'?'go':''}">${k}</button>`).join('')}</div>
    <div id="pextra">${o.extra || ''}</div>`;
  const dots = () => { $('pdots').textContent = v.length ? '●'.repeat(v.length) : '○'.repeat(min); };
  dots();
  let disabled = false;
  el.querySelectorAll('.pad button').forEach(b => b.onclick = () => {
    if (disabled) return;
    const k = b.dataset.k;
    $('perr').textContent = '';
    if (k === '⌫') v = v.slice(0, -1);
    else if (k === 'OK') {
      if (v.length < min) { $('perr').textContent = 'Enter at least ' + min + ' digits'; return; }
      const pin = v; v = ''; dots(); o.onSubmit(pin);
    } else if (v.length < max) v += k;
    dots();
  });
  return {
    error(m) { $('perr').textContent = m; },
    disable(d) { disabled = d; el.querySelectorAll('.pad button').forEach(b => b.disabled = d); },
    clear() { v = ''; dots(); }
  };
}

// ---------------- unlock overlay ----------------
function askUnlock(reason, opts) {
  opts = opts || {};
  return new Promise(resolve => {
    if (!VALS.hasPin) { resolve(true); return; }
    const L = $('lock');
    L.classList.remove('hidden');
    let timer = null;
    const done = ok => { clearInterval(timer); L.classList.add('hidden'); L.innerHTML = ''; resolve(ok); };
    const bio = VALS.bioEnabled === 'true' && !opts.noBio;
    const extra = (bio ? '<button class="btn" id="lbio">FINGERPRINT / FACE</button>' : '') +
                  '<button class="btn small" id="lcancel">CANCEL</button>';
    const p = pad(L, { title: 'Unlock', sub: reason || '', extra, onSubmit: async pin => {
      try {
        const r = await N('verifyPin', { pin });
        if (r.ok) return done(true);
        if (r.lockedSeconds > 0) return lockout(r.lockedSeconds);
        p.error('Wrong PIN');
      } catch (e) { p.error(e.message); }
    }});
    function lockout(sec) {
      p.disable(true);
      clearInterval(timer);
      const tick = () => { p.error('Too many tries. Wait ' + sec + 's'); if (sec-- <= 0) { clearInterval(timer); p.disable(false); p.error(''); } };
      tick(); timer = setInterval(tick, 1000);
    }
    $('lcancel').onclick = () => done(false);
    const tryBio = () => N('biometricAuth', { title: 'Unlock Panic Guard' }).then(() => done(true)).catch(() => {});
    if (bio) { $('lbio').onclick = tryBio; tryBio(); }
  });
}

// ---------------- permission info ----------------
const PERMS = [
  { a:'contacts', t:'Contacts', d:'Lets you choose your two emergency contacts from your phone book.' },
  { a:'sms', t:'Send text messages', d:'Lets the app send your alert SMS directly, without opening a messaging app. Your normal SMS charges may apply.' },
  { a:'location', t:'Precise location', d:'Puts your exact position in the alert message.' },
  { a:'bgLocation', t:'Location "all the time"', d:'Keeps location updates working when the screen is off. On the next screen choose "Allow all the time".' },
  { a:'camera', t:'Camera', d:'Used only to record video after you press panic.' },
  { a:'microphone', t:'Microphone', d:'Used only to record sound after you press panic.' },
  { a:'notifications', t:'Notifications', d:'Android requires a notification while recording. Panic Guard will keep it neutral and quiet. It cannot be fully hidden.' },
  { a:'battery', t:'Battery optimization', d:'Stops Android from pausing the app in the background. On the next screen choose Allow.' }
];
async function permStates() { try { return await N('getPermStates'); } catch (e) { return null; } }

// ---------------- setup wizard ----------------
const STEPS = [{type:'welcome'}, ...PERMS.map(p => ({type:'perm', p})),
  {type:'contacts'}, {type:'pin'}, {type:'bio'}, {type:'message'}, {type:'done'}];
let wi = 0;
function wizStart() { wi = 0; $('wiz').classList.remove('hidden'); wizRender(); }
function wizNext() { wi++; wizRender(); }

function wizRender() {
  const s = STEPS[wi], w = $('wiz');
  const prog = `<div class="prog">Setup ${wi + 1} of ${STEPS.length}</div>`;
  if (s.type === 'welcome') {
    w.innerHTML = prog + `<h1>Welcome</h1>
      <p>Panic Guard sends an SMS with your location to two people you trust and records video and sound when you press the panic button. Everything stays on this phone.</p>
      <p>Setup takes a few minutes: permissions, two contacts, a PIN, fingerprint or face unlock, and your message.</p>
      <button class="btn primary" id="go">START</button>`;
    $('go').onclick = wizNext;
  }
  else if (s.type === 'perm') {
    const p = s.p;
    if (VALS.recording === 'off' && (p.a === 'camera' || p.a === 'microphone')) return wizNext();
    w.innerHTML = prog + `<h1>${p.t}</h1><p>${p.d}</p><div id="pst" class="sub"></div>
      <button class="btn primary" id="allow">ALLOW</button>
      <button class="btn small" id="skip">SKIP FOR NOW</button>
      ${p.a === 'camera' ? '<button class="btn small" id="recoff">I DO NOT WANT RECORDING</button>' : ''}`;
    if ($('recoff')) $('recoff').onclick = async () => { await saveVals({ recording: 'off' }); wizNext(); };
    let opened = false;
    $('skip').onclick = wizNext;
    $('allow').onclick = async () => {
      try {
        if (p.a === 'battery') {
          if (!opened) { opened = true; await N('openBatterySettings'); $('allow').textContent = 'CONTINUE'; return; }
          wizNext(); return;
        }
        const r = await N('requestPerm', { alias: p.a });
        if (r.state === 'granted') return wizNext();
        $('pst').className = 'sub warn';
        $('pst').innerHTML = 'Not allowed yet. If no pop-up appeared, open app settings, tap Permissions, and allow it there.' +
          '<button class="btn small" id="oas">OPEN APP SETTINGS</button>';
        $('oas').onclick = () => N('openAppSettings');
        $('allow').textContent = 'TRY AGAIN';
      } catch (e) { $('pst').className = 'sub bad'; $('pst').textContent = e.message; }
    };
  }
  else if (s.type === 'contacts') wizContacts(prog);
  else if (s.type === 'pin') wizPin(prog);
  else if (s.type === 'bio') wizBio(prog);
  else if (s.type === 'message') {
    w.innerHTML = prog + `<h1>Your alert message</h1>
      <p>This text is sent first. A map link with your location is added automatically.</p>
      <textarea id="msg">${esc(VALS.message || DEFAULT_MSG)}</textarea>
      <button class="btn primary" id="save">SAVE &amp; FINISH</button>`;
    $('save').onclick = async () => {
      const m = $('msg').value.trim() || DEFAULT_MSG;
      await saveVals({ message: m, setupDone: 'true' });
      wizNext();
    };
  }
  else if (s.type === 'done') {
    w.innerHTML = `<h1 class="ok">Setup complete</h1>
      <p>You can change contacts, PIN, fingerprint and message later in Settings (it asks for your PIN).</p>
      <button class="btn primary" id="fin">GO TO HOME</button>`;
    $('fin').onclick = () => { w.classList.add('hidden'); w.innerHTML = ''; renderHome(); show('home'); };
  }
}

async function pickInto(n) {
  const r = await N('pickContact');
  if (!r.number) throw new Error('That contact has no number');
  await saveVals(n === 1 ? { c1Name: r.name, c1Num: r.number } : { c2Name: r.name, c2Num: r.number });
}
const CAMLBL = { front:'FRONT', back:'BACK', both:'BOTH (ALTERNATE)' };
const ALMLBL = { sms:'TEXT (SMS)', auto:'INTERNET FIRST, SMS BACKUP', data:'INTERNET (DATA / WIFI)', both:'TEXT + INTERNET' };
const camMode = () => VALS.camMode || (VALS.camFront === 'false' ? 'back' : 'front');
function newTopic() { const a = new Uint8Array(12); crypto.getRandomValues(a); return 'pg-' + Array.from(a, b => 'abcdefghjkmnpqrstuvwxyz23456789'[b % 31]).join(''); }
function topicText() { const t = VALS.dataTopic; return 'Panic Guard emergency alerts: 1) Install the free ntfy app (Play Store). 2) Open it, tap +, and subscribe to the topic: ' + t + ' (leave the server as ntfy.sh). Or open https://ntfy.sh/' + t + ' in a browser and tap Subscribe. Turn notifications on and set them to high priority. When I press panic you will get my location here.'; }
const haveC = n => !!VALS['c' + n + 'Num'];
let contactRedraw = null;
document.addEventListener('click', async e => {
  const b = e.target.closest && e.target.closest('[data-clear]');
  if (!b) return;
  const n = +b.dataset.clear, other = n === 1 ? 2 : 1;
  if (!haveC(other)) { alert('Keep at least one contact.'); return; }
  const upd = {}; upd['c' + n + 'Name'] = ''; upd['c' + n + 'Num'] = '';
  if (VALS.defaultTarget === String(n) || VALS.defaultTarget === 'both') upd.defaultTarget = '';
  await saveVals(upd);
  if (contactRedraw) contactRedraw();
});
function contactRows() {
  return [1, 2].map(n => {
    const name = VALS['c' + n + 'Name'], num = VALS['c' + n + 'Num'];
    return `<div class="card"><h2>Contact ${n}${n === 2 ? ' (optional)' : ''}</h2>
      <div class="${num ? '' : 'sub'}">${num ? esc(name) + '<br>' + esc(num) : 'Not chosen'}</div>
      <button class="btn small" data-pick="${n}">${num ? 'CHANGE' : 'CHOOSE FROM PHONE'}</button>
      ${num ? `<button class="btn small" data-clear="${n}">REMOVE</button>` : ''}</div>`;
  }).join('');
}
function wizContacts(prog) {
  const w = $('wiz');
  const draw = () => {
    contactRedraw = draw;
    const ok = VALS.c1Num || VALS.c2Num;
    w.innerHTML = prog + `<h1>Emergency contacts</h1><p>Choose one or two people from your phone book. One is enough; the second is optional.</p>
      ${contactRows()}<div id="cerr" class="sub bad"></div>
      <button class="btn primary" id="next" ${ok ? '' : 'disabled'}>NEXT</button>`;
    w.querySelectorAll('[data-pick]').forEach(b => b.onclick = async () => {
      try { await pickInto(+b.dataset.pick); draw(); }
      catch (e) { if (e.message !== 'cancelled') $('cerr').textContent = e.message; }
    });
    $('next').onclick = wizNext;
  };
  draw();
}

function newPinFlow(el, title, onDone, onCancel) {
  let first = null;
  const run = () => {
    const p = pad(el, { title, sub: first ? 'Enter it again to confirm' : 'Choose 4 to 8 digits',
      extra: onCancel ? '<button class="btn small" id="pcancel">CANCEL</button>' : '',
      onSubmit: async pin => {
        if (!first) { first = pin; run(); return; }
        if (pin !== first) { first = null; run(); $('perr').textContent = 'PINs did not match. Start again.'; return; }
        try { await N('setPin', { pin }); await loadVals(); onDone(); } catch (e) { first = null; run(); $('perr').textContent = e.message; }
      }});
    if (onCancel) $('pcancel').onclick = onCancel;
  };
  run();
}
function wizPin(prog) { newPinFlow($('wiz'), 'Set your PIN', wizNext, null); }

async function wizBio(prog) {
  const w = $('wiz');
  let st = 'unavailable';
  try { st = (await N('biometricStatus')).status; } catch (e) {}
  let body;
  if (st === 'available') body = `<p>Use your fingerprint or face to stop recording quickly. This uses the unlock method already set up on your phone. Panic Guard never stores your fingerprint or face.</p>
      <button class="btn primary" id="en">ENABLE</button>`;
  else if (st === 'none_enrolled') body = `<p>No fingerprint or face is set up on this phone yet.</p>
      <button class="btn" id="enr">OPEN PHONE SETTINGS</button><button class="btn" id="chk">CHECK AGAIN</button>`;
  else body = `<p>Strong biometric unlock is not available on this phone. Many Samsung phones count face unlock as weak, so only fingerprint is accepted. Your PIN will still work.</p>`;
  w.innerHTML = prog + `<h1>Fingerprint / face</h1>${body}<div id="berr" class="sub bad"></div>
    <button class="btn small" id="skipb">${st === 'available' ? 'SKIP' : 'NEXT'}</button>`;
  $('skipb').onclick = wizNext;
  if ($('en')) $('en').onclick = async () => {
    try { await N('biometricAuth', { title: 'Confirm to enable' }); await saveVals({ bioEnabled: 'true' }); wizNext(); }
    catch (e) { $('berr').textContent = 'Not enabled: ' + e.message; }
  };
  if ($('enr')) $('enr').onclick = () => N('openBiometricEnroll');
  if ($('chk')) $('chk').onclick = () => wizBio(prog);
}


// ---------------- privacy policy and disclaimer ----------------
const LEGAL_HTML = `
<div class="card"><h2>Important: please read</h2>
<p>Panic Guard is a <b>personal safety aid. It is not an emergency service</b>, and it does not contact the police, an ambulance or any security company. In an emergency, call your local emergency number as well.</p>
<p>The app depends on your phone, battery, mobile signal or internet, location accuracy and Android settings. <b>Alerts can be delayed or fail to arrive</b>, and your location may be missing or inaccurate. Recording may fail or be stopped by the phone. Nobody can guarantee that any message, location or recording will be sent, received or saved.</p>
<p>Your contacts only see an alert if they have a working phone and signal and, for internet alerts, have set up the ntfy app. Please test the app with your contacts regularly using Test Mode.</p>
<p>Camera and microphone use, and sharing recordings, may be restricted by law where you are. You are responsible for using these features lawfully.</p>
<p>To the extent the law allows, the developer is not liable for any loss, injury or damage arising from use of, or inability to use, this app. Nothing here limits any rights you have that cannot be limited by law.</p></div>
<div class="card"><h2>Privacy policy</h2>
<p><b>1. What this app does.</b> When you hold the panic button, Panic Guard sends your chosen emergency contacts a message with your location and, if recording is on, records video and audio on your phone.</p>
<p><b>2. No accounts, no developer servers.</b> You do not create an account. The developer does not run a server that receives your data, and the app has no advertising or analytics. Your settings, contacts, PIN and recordings are stored only on your phone.</p>
<p><b>3. Information the app uses.</b><br>
Emergency contacts: names and numbers you enter, stored on your phone and used only to send your alerts.<br>
Location: used only while an alert is active, for a map link in your message and for location updates if you move.<br>
Camera and microphone: used only during a panic or a test, and only if recording is turned on in Settings. Recordings stay on your phone unless you export or share them.<br>
PIN and fingerprint or face: your PIN is stored on your phone. Fingerprint and face checks are done by Android; the app never receives your biometric data.</p>
<p><b>4. Where information is sent.</b> Information leaves your phone only when you start a panic alert, run a test, or stop an alert and have chosen to send an "I'm safe" message:<br>
By text message (SMS): the message, with a map link, is sent through your phone's SMS service to your contacts. Your mobile network carries it and your network charges apply.<br>
Over the internet (if you turn this on): the message is sent over mobile data or wifi to ntfy.sh, a third-party notification service, under your private alert code. Your contacts receive it by subscribing to that code in the ntfy app. ntfy handles it under its own privacy policy. Anyone who knows your alert code could read your alerts, so keep it private and use "Make a new code" if it is shared by mistake.<br>
Update check: if you use the Update button, the app contacts GitHub to see whether a newer version exists. Nothing is sent to the developer.</p>
<p><b>5. Your control.</b> You choose your contacts, alert method and message and can change them in Settings. You can turn recording off in Settings, and delete recordings inside the app. Uninstalling the app removes all data it stored on your phone. You can turn off any permission in Android settings, but the matching feature will then not work.</p>
<p><b>6. Other people.</b> Please make sure your emergency contacts agree to be listed. Recordings may capture other people. You are responsible for using recording lawfully where you are.</p>
<p><b>7. Children.</b> The app is not designed for children.</p>
<p><b>8. Security.</b> Data stays on your phone, protected by your phone's security and the app PIN. No method is perfectly secure. Keep your phone locked and your PIN private.</p>
<p><b>9. Changes.</b> If this policy changes, the new version will appear in this app after an update.</p>

  $('chpin').onclick = () => {
    const w = $('wiz'); w.classList.remove('hidden');
    newPinFlow(w, 'New PIN', () => { w.classList.add('hidden'); w.innerHTML = ''; renderSettings(); },
      () => { w.classList.add('hidden'); w.innerHTML = ''; });
  };
  $('bio').onclick = async () => {
    try {
      if (VALS.bioEnabled === 'true') await saveVals({ bioEnabled: 'false' });
      else { await N('biometricAuth', { title: 'Confirm to enable' }); await saveVals({ bioEnabled: 'true' }); }
    } catch (e) { alert('Not changed: ' + e.message); }
    renderSettings();
  };
  $('both').onclick = async () => {
    if (VALS.requireBoth !== 'true' && VALS.bioEnabled !== 'true') { alert('Enable fingerprint / face first.'); return; }
    await saveVals({ requireBoth: VALS.requireBoth === 'true' ? 'false' : 'true' });
    renderSettings();
  };
  S.querySelectorAll('[data-perm]').forEach(b => b.onclick = async () => {
    const a = b.dataset.perm;
    try {
      if (a === 'battery') await N('openBatterySettings');
      else { const r = await N('requestPerm', { alias: a }); if (r.state !== 'granted') await N('openAppSettings'); }
    } catch (e) {}
    setTimeout(renderSettings, 800);
  });
  $('oas2').onclick = () => N('openAppSettings');
  const cyc = (arr, cur) => arr[(arr.indexOf(cur) + 1) % arr.length];
  $('stt').onclick = async () => { await saveVals({ defaultTarget: cyc(['', ...(haveC(1) ? ['1'] : []), ...(haveC(2) ? ['2'] : []), ...(haveC(1) && haveC(2) ? ['both'] : [])], VALS.defaultTarget || '') }); renderSettings(); };
  $('fwdsave').onclick = async () => {
    const v = $('fwdnum').value.replace(/[^0-9+]/g, '');
    if (v.replace(/\D/g, '').length < 7) { $('fwdok').className = 'sub bad'; $('fwdok').textContent = 'Enter a full phone number.'; return; }
    await saveVals({ fwdNum: v });
    $('fwdok').className = 'sub ok'; $('fwdok').textContent = 'Saved: ' + v;
  };
  $('sfwdu').onclick = async () => { const on = VALS.fwdUpd !== 'true'; $('sfwdu').textContent = (on ? 'ON' : 'OFF') + ': ALSO FORWARD LOCATION UPDATES'; await saveVals({ fwdUpd: on ? 'true' : 'false' }); renderSettings(); };
  $('sfwd').onclick = async () => {
    const on = VALS.fwdOn !== 'true';
    if (!on) { await saveVals({ fwdOn: 'false' }); renderSettings(); return; }
    if (!VALS.fwdNum) { $('fwdok').className = 'sub bad'; $('fwdok').textContent = 'Type and save a number first.'; return; }
    try { const r = await N('requestPerm', { alias: 'sms' }); if (r.state !== 'granted') { alert('Allow SMS for Panic Guard first.'); await N('openAppSettings'); return; } } catch (e) {}
    let enabled = false;
    try { enabled = (await N('listenerEnabled')).enabled; } catch (e) {}
    if (!enabled) {
      alert('Next screen: turn ON "Panic Guard alert forwarding" (Notification access). If it is greyed out, open App info for Panic Guard, tap the three dots at the top right, choose "Allow restricted settings", then try again.');
      await N('openListenerSettings').catch(() => {});
    }
    await saveVals({ fwdOn: 'true' }); renderSettings();
  };
  $('intsave').onclick = async () => {
    const n = Math.round(+$('intin').value);
    if (!(n >= 1 && n <= 120)) { $('intok').className = 'sub bad'; $('intok').textContent = 'Enter a number from 1 to 120.'; return; }
    await saveVals({ intervalMin: String(n) });
    $('intok').className = 'sub ok'; $('intok').textContent = 'Saved: every ' + n + ' minute' + (n === 1 ? '' : 's');
  };
  $('smove').onclick = async () => { const on = VALS.moveOnly !== 'true'; $('smove').textContent = (on ? 'ON' : 'OFF') + ': ONLY SEND IF I HAVE MOVED'; await saveVals({ moveOnly: on ? 'true' : 'false' }); renderSettings(); };
  $('orecs').onclick = () => { show('recs'); renderRecs(); };
  $('gbat').onclick = () => N('openBatterySettings').catch(() => {});
  $('gapp').onclick = () => N('openAppSettings').catch(() => {});
  $('srec').onclick = async () => { const off = VALS.recording !== 'off'; $('srec').textContent = 'RECORDING: ' + (off ? 'OFF' : 'ON'); await saveVals({ recording: off ? 'off' : 'on' }); renderSettings(); };
  if ($('scam')) $('scam').onclick = async () => { await saveVals({ camMode: cyc(['front', 'back', 'both'], camMode()) }); renderSettings(); };
  $('salm').onclick = async () => { await saveVals({ alertMode: cyc(['sms', 'auto', 'both', 'data'], VALS.alertMode || 'sms') }); if (VALS.alertMode !== 'sms' && !VALS.dataTopic) await saveVals({ dataTopic: newTopic() }); renderSettings(); };
  if ($('ntop')) $('ntop').onclick = async () => { if (confirm('Make a new code? Your contacts must subscribe to the new one.')) { await saveVals({ dataTopic: newTopic() }); renderSettings(); } };
  if ($('shtop')) $('shtop').onclick = async () => {
    if (!VALS.dataTopic) await saveVals({ dataTopic: newTopic() });
    const t = topicText();
    try { if (navigator.share) { await navigator.share({ text: t }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(t); alert('Copied. Paste it into a message to your contact.'); } catch (e) { alert(t); }
  };
  $('sneu').onclick = async () => { await saveVals({ neutral: cyc(['calc', 'blank', 'status'], VALS.neutral || 'calc') }); renderSettings(); };
  $('legalbtn').onclick = () => showLegal(false);
  $('ssafe').onclick = async () => { const on = VALS.sendSafe !== 'true'; $('ssafe').textContent = (on ? 'ON' : 'OFF') + ': SEND "I\'M SAFE" SMS WHEN I UNLOCK'; await saveVals({ sendSafe: on ? 'true' : 'false' }); renderSettings(); };
  $('svol').onclick = async () => { const on = VALS.volTriple !== 'true'; $('svol').textContent = (on ? 'ON' : 'OFF') + ': TRIPLE VOLUME PRESS (APP OPEN ONLY)'; await saveVals({ volTriple: on ? 'true' : 'false' }); renderSettings(); };
  $('clog').onclick = async () => { await N('clearLog'); renderSettings(); };
  $('rerun').onclick = wizStart;
  try {
    const rr = await N('listRecordings'); const n = JSON.parse(rr.json || '[]').length;
    $('recinfo').textContent = n + ' clip' + (n === 1 ? '' : 's') + ', ' + (rr.total / 1048576).toFixed(1) + ' MB used, ' + (rr.free / 1073741824).toFixed(1) + ' GB free';
  } catch (e) { $('recinfo').textContent = 'Not available.'; }
  try {
    const log = JSON.parse((await N('getLog')).json || '[]').slice(-15).reverse();
    $('logbox').innerHTML = log.length ? log.map(e => `<div class="msgline">${new Date(e.t).toLocaleString()}<br>${esc(e.m)}</div>`).join('') : 'No events yet.';
  } catch (e) { $('logbox').textContent = 'Not available.'; }
}

// ---------------- recordings ----------------
function clipLabel(n) {
  const m = /^(panic|test)_(\d{4})(\d{2})(\d{2})_(\d{2})(\d{2})(\d{2})/.exec(n);
  return m ? (m[1] === 'test' ? 'TEST clip ' : 'Panic clip ') + `${m[2]}-${m[3]}-${m[4]} ${m[5]}:${m[6]}:${m[7]}` : n;
}
async function renderRecs() {
  const R = $('recs');
  let list = [], info = {};
  try { info = await N('listRecordings'); list = JSON.parse(info.json || '[]').reverse(); } catch (e) {}
  const mb = b => (b / 1048576).toFixed(1) + ' MB';
  R.innerHTML = `<h1>Recordings</h1><div class="sub">${list.length} clip${list.length === 1 ? '' : 's'}, ${mb(info.total || 0)} used</div>
    <button class="btn small" id="rback">BACK TO SETTINGS</button>
    ${list.map(c => `<div class="card" data-clip="${esc(c.name)}"><b>${esc(clipLabel(c.name))}</b><div class="sub">${mb(c.size)}</div>
      <button class="btn small" data-act="play">PLAY</button>
      <button class="btn small" data-act="share">SHARE</button>
      <button class="btn small" data-act="export">EXPORT</button>
      <button class="btn small" data-act="delete">DELETE</button>
      <div class="sub" data-msg></div></div>`).join('') || '<div class="card sub">No recordings yet.</div>'}
    ${list.length ? '<button class="btn small" id="rdelall">DELETE ALL</button>' : ''}`;
  $('rback').onclick = () => { show('settings'); renderSettings(); };
  R.querySelectorAll('[data-clip]').forEach(card => {
    const name = card.dataset.clip, msg = card.querySelector('[data-msg]');
    const say = (t, c) => { msg.className = 'sub ' + (c || ''); msg.innerHTML = t; };
    card.querySelectorAll('[data-act]').forEach(b => b.onclick = async () => {
      const a = b.dataset.act;
      try {
        if (a === 'play') await N('playRecording', { name });
        else if (a === 'share') await N('shareRecording', { name });
        else if (a === 'export') {
          msg.innerHTML = '<button class="btn small" data-d="movies">TO MOVIES</button><button class="btn small" data-d="downloads">TO DOWNLOADS</button>';
          msg.querySelectorAll('[data-d]').forEach(x => x.onclick = async () => {
            try { const r = await N('exportRecording', { name, dest: x.dataset.d }); say('Saved to ' + esc(r.path), 'ok'); }
            catch (e) { say(esc(e.message || e), 'bad'); }
          });
        } else if (a === 'delete') {
          if (b.dataset.sure) { await N('deleteRecording', { name }); renderRecs(); }
          else { b.dataset.sure = '1'; b.textContent = 'TAP AGAIN TO DELETE'; setTimeout(() => { b.dataset.sure = ''; b.textContent = 'DELETE'; }, 4000); }
        }
      } catch (e) { say(esc(e.message || e), 'bad'); }
    });
  });
  if ($('rdelall')) $('rdelall').onclick = async () => {
    const b = $('rdelall');
    if (b.dataset.sure) { await N('deleteAllRecordings'); renderRecs(); }
    else { b.dataset.sure = '1'; b.textContent = 'TAP AGAIN: DELETE ALL CLIPS'; setTimeout(() => { b.dataset.sure = ''; b.textContent = 'DELETE ALL'; }, 4000); }
  };
}

// ---------------- navigation ----------------
function show(name) {
  for (const s of ['home','update','settings','recs']) $(s).classList.toggle('hidden', s !== name);
  $('n-home').classList.toggle('active', name === 'home');
  $('n-update').classList.toggle('active', name === 'update');
  $('n-settings').classList.toggle('active', name === 'settings' || name === 'recs');
}
$('n-home').onclick = () => { show('home'); renderHome(); };
$('n-settings').onclick = openSettings;
$('n-update').onclick = () => show('update');
document.addEventListener('visibilitychange', () => { if (!document.hidden && !$('home').classList.contains('hidden')) renderHome(); });

$('n-share').onclick = async () => {
  try {
    await N('shareText', { title: 'Share Panic Guard',
      text: 'Panic Guard (Android app). Download the latest version here: ' + RELEASES_PAGE });
  } catch (e) { alert('Could not open the share sheet.'); }
};

// ---------------- update ----------------
$('u-check').onclick = async () => {
  const msg = $('u-msg');
  $('u-install').classList.add('hidden');
  msg.className = 'sub'; msg.textContent = 'Checking…';
  if (!navigator.onLine) { msg.className = 'sub warn'; msg.textContent = 'You are offline. Updating needs an internet connection.'; return; }
  try {
    const r = await fetch(API_LATEST, { headers: { Accept: 'application/vnd.github+json' } });
    if (r.status === 404) { msg.textContent = 'No release found yet.'; return; }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    const m = /(\d+)\s*$/.exec(j.tag_name || '');
    const code = m ? parseInt(m[1], 10) : 0;
    $('u-latest').textContent = (j.tag_name || '?').replace(/^v/, '');
    if (code > installed.versionCode) {
      msg.className = 'sub warn'; msg.textContent = 'A newer version is available.';
      $('u-install').classList.remove('hidden');
    } else { msg.className = 'sub ok'; msg.textContent = 'You have the latest version.'; }
  } catch (e) { msg.className = 'sub warn'; msg.textContent = 'Could not reach GitHub. Check your connection and try again.'; }
};
async function installLatest() {
  const msg = $('u-msg');
  if (!navigator.onLine) { msg.className = 'sub warn'; msg.textContent = 'You are offline. Installing needs an internet connection.'; return; }
  try {
    const { allowed } = await N('canInstall');
    if (!allowed) {
      msg.className = 'sub warn';
      msg.textContent = 'Allow "Install unknown apps" for Panic Guard on the next screen, press back, then tap this button again.';
      await N('openInstallSettings'); return;
    }
    msg.className = 'sub'; msg.textContent = 'Downloading…';
    $('u-barwrap').classList.remove('hidden'); $('u-bar').style.width = '0%';
    try { await PG.addListener('downloadProgress', p => { $('u-bar').style.width = p.percent + '%'; }); } catch (e) {}
    await N('downloadAndInstall', { url: APK_URL });
    msg.textContent = 'Opening installer…';
  } catch (e) { msg.className = 'sub bad'; msg.textContent = 'Install failed: ' + (e.message || e); }
}
$('u-install').onclick = installLatest;
$('n-install').onclick = () => { show('update'); installLatest(); };

// ---------------- start ----------------
(async function init() {
  try { installed = await N('getAppInfo'); } catch (e) {}
  $('ver').textContent = 'Version ' + installed.versionName;
  $('u-inst').textContent = installed.versionName;
  if (!PG) { $('summary').innerHTML = '<b class="warn">This is the website preview.</b><br>Install the app from the GitHub Release to use Panic Guard.'; return; }
  await renderHome();
  try { const st = JSON.parse((await N('getPanicState')).json || '{}'); if (st.active) showPanic(); } catch (e) {}
  if (VALS.legalOk !== 'true') await showLegal(true);
  if (VALS.setupDone !== 'true') wizStart();
})();
</script>
</body>
</html>
